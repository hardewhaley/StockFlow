{% extends "base.html" %}

{% block title %}Edit Supplier | StockFlow{% endblock %}

{% block content %}
{% set f = request.form %}

<section class="product-form-page">

    <header class="page-header">
        <div>
            <h1>Edit Supplier</h1>
            <p>Update this supplier's contact details.</p>
        </div>

        <a href="{{ url_for('suppliers') }}" class="btn-back">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Suppliers
        </a>
    </header>

    <div class="product-form-card">
        <form method="POST" action="{{ url_for('edit_supplier', supplier_id=supplier.id) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-section">
                <h2>Supplier Information</h2>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="full_name">Supplier Name *</label>
                        <input type="text" id="full_name" name="full_name"
                               value="{{ f.get('full_name', supplier.full_name) }}" maxlength="100" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" name="email"
                               value="{{ f.get('email', supplier.email) }}" maxlength="120" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number *</label>
                        <input type="tel" id="phone" name="phone"
                               value="{{ f.get('phone', supplier.phone) }}" maxlength="25" required>
                    </div>

                    <div class="form-group full-width">
                        <label for="address">Address *</label>
                        <textarea id="address" name="address"
                                  maxlength="255" rows="3" required>{{ f.get('address', supplier.address) }}</textarea>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('suppliers') }}" class="btn-cancel">Cancel</a>

                <button type="submit" class="btn-save-product">
                    <i class="fa-solid fa-floppy-disk"></i>
                    Save Changes
                </button>
            </div>
        </form>
    </div>

</section>
{% endblock %}
