{% extends "base.html" %}

{% block title %}Add Category | StockFlow{% endblock %}

{% block content %}
<div class="categories-page">

    <header class="page-header">
        <div>
            <h1>Add Category</h1>
            <p>Create a new category for your products.</p>
        </div>

        <a href="{{ url_for('categories') }}" class="btn-back">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Categories
        </a>
    </header>

    <div class="category-card category-form-card">
        <form method="POST" class="category-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-section">
                <h2>
                    <i class="fa-solid fa-layer-group"></i>
                    Category Information
                </h2>

                <p class="form-description">
                    Enter the name and description for this category.
                </p>

                <div class="form-group">
                    <label for="name">Category Name <span>*</span></label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        maxlength="100"
                        placeholder="e.g. Electronics"
                        value="{{ request.form.get('name', '') }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea
                        id="description"
                        name="description"
                        maxlength="300"
                        rows="4"
                        placeholder="Describe this category (optional)"
                    >{{ request.form.get('description', '') }}</textarea>
                </div>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('categories') }}" class="btn-cancel">Cancel</a>

                <button type="submit" class="btn-save-category">
                    <i class="fa-solid fa-floppy-disk"></i>
                    Save Category
                </button>
            </div>
        </form>
    </div>

</div>
{% endblock %}
