
{% extends "base.html" %}

{% block title %}Add Category | StockFlow{% endblock %}

{% block content %}
<div class="categories-page">

    <div class="page-header">
        <div>
            <h2>Add Category</h2>
            <p>Create a new category for your products.</p>
        </div>

        <a href="{{ url_for('categories') }}" class="btn-primary">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Categories
        </a>
    </div>

    <div class="category-card category-form-card">
        <form method="POST" class="category-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="name">Category Name <span>*</span></label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    maxlength="100"
                    placeholder="e.g. Electronics"
                    value="{{ request.form.get('name', '') }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea
                    id="description"
                    name="description"
                    maxlength="300"
                    rows="4"
                    placeholder="Describe this category (optional)"
                >{{ request.form.get('description', '') }}</textarea>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('categories') }}" class="btn-cancel">
                    Cancel
                </a>

                <button type="submit" class="btn-primary">
                    <i class="fa-solid fa-plus"></i>
                    Save Category
                </button>
            </div>
        </form>
    </div>

</div>
{% endblock %}
