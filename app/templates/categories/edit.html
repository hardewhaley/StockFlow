{% extends "base.html" %}

{% block title %}Edit Category | StockFlow{% endblock %}

{% block content %}
<div class="categories-page">

    <header class="page-header">
        <div>
            <h1>Edit Category</h1>
            <p>Update the category information.</p>
        </div>

        <a href="{{ url_for('categories') }}" class="btn-back">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Categories
        </a>
    </header>

    <div class="category-card category-form-card">
        <form method="POST" class="category-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-section">
                <h2>
                    <i class="fa-solid fa-pen-to-square"></i>
                    Category Information
                </h2>

                <p class="form-description">
                    Make the necessary changes below.
                </p>

                <div class="form-group">
                    <label for="name">Category Name <span>*</span></label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        maxlength="100"
                        value="{{ request.form.get('name', category.name) }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea
                        id="description"
                        name="description"
                        maxlength="300"
                        rows="4"
                        placeholder="Describe this category (optional)"
                    >{{ request.form.get('description', category.description or '') }}</textarea>
                </div>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('categories') }}" class="btn-cancel">Cancel</a>

                <button type="submit" class="btn-save-category">
                    <i class="fa-solid fa-floppy-disk"></i>
                    Update Category
                </button>
            </div>
        </form>
    </div>

</div>
{% endblock %}
