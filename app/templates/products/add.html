{% extends "base.html" %}

{% block title %}Add Product | StockFlow{% endblock %}

{% block content %}
{% set f = request.form %}

<section class="product-form-page">

    <header class="page-header">
        <div>
            <h1>Add Product</h1>
            <p>Add a new item to your inventory.</p>
        </div>

        <a href="{{ url_for('products') }}" class="btn-back">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Products
        </a>
    </header>

    <div class="product-form-card">
        <form method="POST" action="{{ url_for('add_product') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-section">
                <h2>Product Information</h2>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="name">Product Name *</label>
                        <input type="text" id="name" name="name"
                               value="{{ f.get('name', '') }}"
                               maxlength="100" required>
                    </div>

                    <div class="form-group">
                        <label for="category_id">Category *</label>
                        <select id="category_id" name="category_id" required>
                            <option value="" disabled {% if not f.get('category_id') %}selected{% endif %}>
                                Select category
                            </option>
                            {% for category in categories %}
                            <option value="{{ category.id }}"
                                {% if f.get('category_id', '') == category.id|string %}selected{% endif %}>
                                {{ category.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="supplier_id">Supplier *</label>
                        <select id="supplier_id" name="supplier_id" required>
                            <option value="" disabled {% if not f.get('supplier_id') %}selected{% endif %}>
                                Select supplier
                            </option>
                            {% for supplier in suppliers %}
                            <option value="{{ supplier.id }}"
                                {% if f.get('supplier_id', '') == supplier.id|string %}selected{% endif %}>
                                {{ supplier.full_name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label for="description">Description</label>
                        <textarea id="description" name="description"
                                  maxlength="300" rows="4">{{ f.get('description', '') }}</textarea>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h2>Pricing and Stock</h2>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="purchase_price">Purchase Price (₦) *</label>
                        <input type="number" id="purchase_price" name="purchase_price"
                               min="0" step="0.01" inputmode="decimal"
                               value="{{ f.get('purchase_price', '') }}" required>
                    </div>

                    <div class="form-group">
                        <label for="selling_price">Selling Price (₦) *</label>
                        <input type="number" id="selling_price" name="selling_price"
                               min="0" step="0.01" inputmode="decimal"
                               value="{{ f.get('selling_price', '') }}" required>
                    </div>

                    <div class="form-group">
                        <label for="quantity">Initial Quantity *</label>
                        <input type="number" id="quantity" name="quantity"
                               min="0" step="1" inputmode="numeric"
                               value="{{ f.get('quantity', '0') }}" required>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('products') }}" class="btn-cancel">Cancel</a>

                <button type="submit" class="btn-save-product">
                    <i class="fa-solid fa-floppy-disk"></i>
                    Save Product
                </button>
            </div>
        </form>
    </div>

</section>
{% endblock %}
